name: Android APK (Godot)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build and smoke-test Android debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.5.2"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17 before Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          # The legacy 'tools' package was removed from Android SDK repositories.
          packages: 'platform-tools'

      - name: Install required Android platform packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-35" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Download matching Godot editor + export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 4 "${BASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
          curl -fL --retry 4 "${BASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Configure Godot Android export paths and stable testing key
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/dev-signing/aether-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          keytool -list -keystore dev-signing/aether-debug.keystore -storepass android -alias androiddebugkey >/dev/null

      # Android requires the new APK to have a larger versionCode than the installed one.
      - name: Set unique Android version for upgrade installs
        shell: bash
        run: |
          set -euo pipefail
          BUILD_VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))
          BUILD_VERSION_NAME="0.1.${GITHUB_RUN_NUMBER}"
          export BUILD_VERSION_CODE BUILD_VERSION_NAME
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          path = Path("export_presets.cfg")
          contents = path.read_text()
          contents, count_code = re.subn(r'(?m)^version/code=\d+$', 'version/code=' + os.environ['BUILD_VERSION_CODE'], contents)
          contents, count_name = re.subn(r'(?m)^version/name="[^"]+"$', 'version/name="' + os.environ['BUILD_VERSION_NAME'] + '"', contents)
          assert count_code == 1 and count_name == 1, "Android export version fields not found"
          path.write_text(contents)
          PY
          echo "BUILD_VERSION_CODE=$BUILD_VERSION_CODE" >> "$GITHUB_ENV"
          echo "Android upgrade build: versionCode=$BUILD_VERSION_CODE versionName=$BUILD_VERSION_NAME"

      - name: Static project checks
        run: python3 tests/verify_project.py

      - name: Import assets and validate GDScript
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee /tmp/godot-import.log
          if grep -Eq '(SCRIPT ERROR|Parse Error|Failed to load script|ERROR:.*(parser|Parse|script))' /tmp/godot-import.log; then exit 1; fi

      - name: Run game headless smoke test
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --quit-after 120 2>&1 | tee /tmp/godot-smoke.log
          if grep -Eq '(SCRIPT ERROR|Parse Error|Failed to load script|ERROR:.*(parser|Parse|script))' /tmp/godot-smoke.log; then exit 1; fi

      - name: Verify real gameplay progression in Godot
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --script res://tests/smoke.gd 2>&1 | tee /tmp/godot-gameplay.log
          grep -Fq 'PASS: scene, start, quest, 3 seeds, gate, boss victory, persistent save/load' /tmp/godot-gameplay.log
          grep -Fq 'PASS: early seed drops, pickups, facing and cooldown HUD' /tmp/godot-gameplay.log
          if grep -Eq '(SCRIPT ERROR|Parse Error|GAME SMOKE FAILED)' /tmp/godot-gameplay.log; then exit 1; fi

      - name: Export signed debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/dev-signing/aether-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p build
          /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --export-debug Android build/EchoesOfAether-debug.apk
          test -s build/EchoesOfAether-debug.apk
          unzip -tqq build/EchoesOfAether-debug.apk

      - name: Verify APK can upgrade installed game
        shell: bash
        run: |
          set -euo pipefail
          APK="build/EchoesOfAether-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          KEYSTORE="dev-signing/aether-debug.keystore"
          PACKAGE_INFO="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$PACKAGE_INFO"
          [[ "$PACKAGE_INFO" == *"name='org.lokij.echoesofaether'"* ]] || { echo "ERROR: Package ID changed; this APK cannot update the installed game."; exit 1; }
          [[ "$PACKAGE_INFO" == *"versionCode='$BUILD_VERSION_CODE'"* ]] || { echo "ERROR: Android version code does not match this run."; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK"
          APK_CERT_SHA="$("$APKSIGNER" verify --print-certs "$APK" | awk '/Signer #1 certificate SHA-256 digest:/ {print tolower($NF); exit}')"
          KEY_CERT_SHA="$(keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey | awk '/SHA256:/ {gsub(":","",$2); print tolower($2); exit}')"
          [[ -n "$APK_CERT_SHA" && "$APK_CERT_SHA" == "$KEY_CERT_SHA" ]] || { echo "ERROR: APK signature does not match the stable debug key."; exit 1; }
          echo "PASS: APK has stable app ID, increasing CI version, and original signing certificate."

      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: EchoesOfAether-Android-debug-APK
          path: build/EchoesOfAether-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-build-logs
          path: |
            /tmp/godot-import.log
            /tmp/godot-smoke.log
            /tmp/godot-gameplay.log
          if-no-files-found: ignore
