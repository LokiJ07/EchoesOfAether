name: Android APK (Godot)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build and smoke-test Android debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.5.2"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Integrate original Higgsfield v1 realm backdrops
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fetch_v1_art.py

      # Commit downloaded game art once; subsequent builds read the permanent PNGs
      # from the repository and do not need external services.
      - name: Save new original art into repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        run: |
          git add assets/v1_bg_crystal.png assets/v1_bg_sky.png assets/v1_bg_marsh.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "assets: preserve original Higgsfield realm backgrounds"
            git push origin HEAD:main
          fi

      - name: Install v2 sprite processing dependencies
        shell: bash
        run: |
          python3 -m pip install --user --disable-pip-version-check Pillow numpy

      - name: Convert and import ALL original Higgsfield backgrounds and unique mob sprites
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fetch_v2_art.py

      # Preserve the compiled sprites as real project assets for all later builds.
      - name: Commit actual processed v2 art to GitHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        run: |
          git add assets/v2_*.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "assets: import original Higgsfield Emberfall realm and unique mobs"
            git push origin HEAD:main
          fi

      - name: Produce unique v5 realm panoramas locally without generation credits
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_v5_art.py

      - name: Preserve locally generated PNGs as permanent game assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        run: |
          git add assets/v5_generated_*.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "assets: preserve seven original locally generated realm panoramas"
            git push origin HEAD:main
          fi

      - name: Render eight unique illustrated dungeon annex backgrounds (offline)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_v6_art.py

      - name: Preserve new v6 room artwork in game repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        run: |
          git add assets/v6_generated_*.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "assets: import unique v6 illustrated dungeon annexes"
            git push origin HEAD:main
          fi

      - name: Generate twelve distinctive v7 mob and boss silhouettes (offline)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_v7_mobs.py

      - name: Preserve original v7 mob and boss artwork in repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        run: |
          git add assets/v7_*.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "assets(v7): twelve distinct realm creatures and guardian designs"
            git push origin HEAD:main
          fi

      - name: Set up Java 17 before Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          # The legacy 'tools' package was removed from Android SDK repositories.
          packages: 'platform-tools'

      - name: Install required Android platform packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-35" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Download matching Godot editor + export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 4 "${BASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
          curl -fL --retry 4 "${BASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Configure Godot Android export paths and stable testing key
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/dev-signing/aether-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          keytool -list -keystore dev-signing/aether-debug.keystore -storepass android -alias androiddebugkey >/dev/null

      # Android requires the new APK to have a larger versionCode than the installed one.
      - name: Set unique Android version for upgrade installs
        shell: bash
        run: |
          set -euo pipefail
          BUILD_VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))
          BUILD_VERSION_NAME="7.0.${GITHUB_RUN_NUMBER}"
          export BUILD_VERSION_CODE BUILD_VERSION_NAME
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          path = Path("export_presets.cfg")
          contents = path.read_text()
          contents, count_code = re.subn(r'(?m)^version/code=\d+$', 'version/code=' + os.environ['BUILD_VERSION_CODE'], contents)
          contents, count_name = re.subn(r'(?m)^version/name="[^"]+"$', 'version/name="' + os.environ['BUILD_VERSION_NAME'] + '"', contents)
          assert count_code == 1 and count_name == 1, "Android export version fields not found"
          path.write_text(contents)
          PY
          echo "BUILD_VERSION_CODE=$BUILD_VERSION_CODE" >> "$GITHUB_ENV"
          echo "Android upgrade build: versionCode=$BUILD_VERSION_CODE versionName=$BUILD_VERSION_NAME"

      - name: Static project checks
        run: python3 tests/verify_project.py

      - name: Import assets and validate GDScript
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee /tmp/godot-import.log
          if grep -Eq '(SCRIPT ERROR|Parse Error|Failed to load script|ERROR:.*(parser|Parse|script))' /tmp/godot-import.log; then exit 1; fi

      - name: Capture real Godot rendered screens for visual QA
        continue-on-error: true
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p build
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" timeout 65s /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --path . --rendering-method gl_compatibility --script res://tests/visual_capture.gd 2>&1 | tee /tmp/godot-visual.log
          python3 - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          import base64, io
          from pathlib import Path
          files = sorted(Path('build').glob('visual_*.png'))
          if len(files) < 4:
              raise RuntimeError(f'Expected 4 visual captures, found {len(files)}')
          thumbs = Image.new('RGB', (800, ((len(files)+1)//2)*266), '#19212d')
          d = ImageDraw.Draw(thumbs)
          for i,path in enumerate(files):
              art = Image.open(path).convert('RGB')
              art.thumbnail((394,236))
              x=(i%2)*400+(400-art.width)//2
              y=(i//2)*266+20
              thumbs.paste(art,(x,y))
              d.text(((i%2)*400+10,(i//2)*266+5),path.stem,fill='white')
          buffer=io.BytesIO()
          thumbs.save(buffer,'JPEG',quality=36,optimize=True)
          print('V7_VISUAL_CONTACT_SHEET_BASE64='+base64.b64encode(buffer.getvalue()).decode(),flush=True)
          PY

      - name: Upload actual Godot visual QA frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EchoesOfAether-visual-QA
          path: build/visual_*.png
          if-no-files-found: ignore

      - name: Run game headless smoke test
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --quit-after 120 2>&1 | tee /tmp/godot-smoke.log
          if grep -Eq '(SCRIPT ERROR|Parse Error|Failed to load script|ERROR:.*(parser|Parse|script))' /tmp/godot-smoke.log; then exit 1; fi

      - name: Verify real gameplay progression in Godot
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --script res://tests/smoke.gd 2>&1 | tee /tmp/godot-gameplay.log
          grep -Fq 'PASS: scene, start, quest, 3 seeds, gate, boss victory, persistent save/load' /tmp/godot-gameplay.log
          grep -Fq 'PASS: early seed drops, pickups, facing and cooldown HUD' /tmp/godot-gameplay.log
          grep -Fq 'PASS: relic caches, Windstep, Astral Edge, Vital Spark, bounty hunts, persistent upgrades' /tmp/godot-gameplay.log
          grep -Fq 'PASS: legacy save migration with original progress preserved' /tmp/godot-gameplay.log
          if grep -Eq '(SCRIPT ERROR|Parse Error|GAME SMOKE FAILED)' /tmp/godot-gameplay.log; then exit 1; fi

      - name: Validate expanded worlds, portal combat and ultra-wide controls
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --script res://tests/world_expansion.gd 2>&1 | tee /tmp/godot-world.log
          grep -Fq 'PASS: ultrawide fullscreen, responsive mobile movement, portals, three realms, bosses, hazards and save/load' /tmp/godot-world.log
          if grep -Eq '(SCRIPT ERROR|Parse Error|WORLD EXPANSION FAILED)' /tmp/godot-world.log; then exit 1; fi

      - name: Validate v0.6 HUD editor, combat and save upgrades
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --script res://tests/v06_custom_hud.gd 2>&1 | tee /tmp/godot-v06.log
          grep -Fq 'PASS: v0.6 HUD drag, scale, transparency, reset, persistence, guard, combo, mastery, legacy saves' /tmp/godot-v06.log
          grep -Fq 'PASS: adaptive HUD stays in bounds on compact, 16:9, 20:9, 4:3 and ultrawide displays' /tmp/godot-v06.log
          if grep -Eq '(SCRIPT ERROR|Parse Error|V0.6 FAILED)' /tmp/godot-v06.log; then exit 1; fi

      - name: Verify v1.0 animated combat, puzzle accessibility, save migration and offline art
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --script res://tests/v1_awakening.gd 2>&1 | tee /tmp/godot-v1.log
          grep -Fq 'PASS: v1 offline backgrounds, animated poses, optional puzzles, rewards, exit, save migration, settings and boss telegraphs' /tmp/godot-v1.log
          if grep -Eq '(SCRIPT ERROR|Parse Error|V1 TEST FAILED)' /tmp/godot-v1.log; then exit 1; fi

      - name: Verify v2 Emberfall gameplay, unique mobs, mobile controls, portals and saves
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --script res://tests/v2_shattered_realms.gd 2>&1 | tee /tmp/godot-v2.log
          grep -Fq 'PASS: v2 original Higgsfield art, 20 unique sprites, dungeon and new mobs' /tmp/godot-v2.log
          grep -Fq 'PASS: relocated mobile joystick, action buttons, touch transforms and persistence' /tmp/godot-v2.log
          grep -Fq 'PASS: old v1 saves upgrade to Emberfall and install-over progress survives' /tmp/godot-v2.log
          grep -Fq 'PASS: optional fire puzzles, one-time rewards, emberling companion and hunt persistence' /tmp/godot-v2.log
          grep -Fq 'PASS: chapter victory, multi-phase Cinder Warden and saved boss clear' /tmp/godot-v2.log
          if grep -Eq '(SCRIPT ERROR|Parse Error|V2 TEST FAILED)' /tmp/godot-v2.log; then exit 1; fi

      - name: Verify v5 portal worlds, dungeon scenes, 30 RPG quests, AI rotations and save migration
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --script res://tests/v5_realms.gd 2>&1 | tee /tmp/godot-v5.log
          grep -Fq 'PASS: 19 separate portal PackedScenes, non-seam cameras, optional dungeon guardian and story' /tmp/godot-v5.log
          grep -Fq 'PASS: seven original offline generated realm backgrounds directly imported into Godot' /tmp/godot-v5.log
          grep -Fq 'PASS: 30 persistent multi-realm quests with one-time rewards and story progress' /tmp/godot-v5.log
          grep -Fq 'PASS: tracked RPG journal quests, real touch targets, persistence and automatic completion' /tmp/godot-v5.log
          grep -Fq 'PASS: unique combat patterns, Abyssal Depths, Everdawn, Aether Nexus, final boss and persistence' /tmp/godot-v5.log
          grep -Fq 'PASS: safe v2 save migration, fixed signing identity and unchanged custom control settings' /tmp/godot-v5.log
          if grep -Eq '(SCRIPT ERROR|Parse Error|V5 FAILED)' /tmp/godot-v5.log; then exit 1; fi

      - name: Verify v6 deep dungeon annexes, four playable puzzle types and 46 quests
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM 120s /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --script res://tests/v6_deep_realms.gd 2>&1 | tee /tmp/godot-v6.log
          grep -Fq 'PASS: eight portal dungeon annexes, imported unique backgrounds, and expanded 46-quest journal' /tmp/godot-v6.log
          grep -Fq 'PASS: sliding mural assembly, legal moves, optional exits, progression rewards and quest events' /tmp/godot-v6.log
          grep -Fq 'PASS: pipe-connectivity, logic equations, memory sequence and nonpunishing hints' /tmp/godot-v6.log
          grep -Fq 'PASS: all eight puzzle paths, save compatibility, and completed-chamber persistence' /tmp/godot-v6.log
          grep -Fq 'PASS: 52 discoverable realm secrets, ten exploration quests and permanent rewards' /tmp/godot-v6.log
          if grep -Eq '(SCRIPT ERROR|Parse Error|V6 FAILED)' /tmp/godot-v6.log; then exit 1; fi

      - name: Validate v7 field fixes, real vertical exploration and six combat patterns
        shell: bash
        run: |
          set -eo pipefail
          timeout --signal=TERM 120s /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --script res://tests/v7_field_review.gd 2>&1 | tee /tmp/godot-v7.log
          grep -Fq 'PASS: late-stage portal maps remain playable after actual physics frames' /tmp/godot-v7.log
          grep -Fq 'PASS: 12 new differentiated high-contrast enemy and boss sprites actually imported' /tmp/godot-v7.log
          grep -Fq 'PASS: 26 nonblocking 3-tier vertical routes and accessible platforming collectibles' /tmp/godot-v7.log
          grep -Fq 'PASS: physical skyshard pickup, one-time rewards, 12 RPG quests and saved progress' /tmp/godot-v7.log
          grep -Fq 'PASS: six distinct dodgeable boss attack patterns' /tmp/godot-v7.log
          if grep -Eq '(SCRIPT ERROR|Parse Error|V7 FIELD REVIEW FAILED)' /tmp/godot-v7.log; then exit 1; fi

      - name: Verify reusable Aether puzzle mechanics
        shell: bash
        run: |
          set -eo pipefail
          timeout --signal=TERM 120s /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --script res://tests/test_aether_mechanics.gd 2>&1 | tee /tmp/godot-aether-mechanics.log
          grep -Fq 'AETHER MECHANICS TESTS PASSED' /tmp/godot-aether-mechanics.log
          if grep -Eq '(SCRIPT ERROR|Parse Error|Assertion failed)' /tmp/godot-aether-mechanics.log; then exit 1; fi

      - name: Verify v8 optional chime and counterweight dungeon encounters
        shell: bash
        run: |
          set -eo pipefail
          timeout --signal=TERM 120s /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --script res://tests/v8_optional_puzzles.gd 2>&1 | tee /tmp/godot-v8.log
          grep -Fq 'PASS: optional chime and counterweight altars, mobile interaction, one-time rewards and save migration' /tmp/godot-v8.log
          if grep -Eq '(SCRIPT ERROR|Parse Error|V8 BONUS FAILED)' /tmp/godot-v8.log; then exit 1; fi

      - name: Export signed debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/dev-signing/aether-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p build
          /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --export-debug Android build/EchoesOfAether-debug.apk
          test -s build/EchoesOfAether-debug.apk
          unzip -tqq build/EchoesOfAether-debug.apk

      - name: Verify APK can upgrade installed game
        shell: bash
        run: |
          set -euo pipefail
          APK="build/EchoesOfAether-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          KEYSTORE="dev-signing/aether-debug.keystore"
          PACKAGE_INFO="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$PACKAGE_INFO"
          [[ "$PACKAGE_INFO" == *"name='org.lokij.echoesofaether'"* ]] || { echo "ERROR: Package ID changed; this APK cannot update the installed game."; exit 1; }
          [[ "$PACKAGE_INFO" == *"versionCode='$BUILD_VERSION_CODE'"* ]] || { echo "ERROR: Android version code does not match this run."; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK"
          APK_CERT_SHA="$("$APKSIGNER" verify --print-certs "$APK" | awk '/Signer #1 certificate SHA-256 digest:/ {print tolower($NF); exit}')"
          KEY_CERT_SHA="$(keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey | awk '/SHA256:/ {gsub(":","",$2); print tolower($2); exit}')"
          [[ -n "$APK_CERT_SHA" && "$APK_CERT_SHA" == "$KEY_CERT_SHA" ]] || { echo "ERROR: APK signature does not match the stable debug key."; exit 1; }
          echo "PASS: APK has stable app ID, increasing CI version, and original signing certificate."

      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: EchoesOfAether-Android-debug-APK
          path: build/EchoesOfAether-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-build-logs
          path: |
            /tmp/godot-import.log
            /tmp/godot-smoke.log
            /tmp/godot-gameplay.log
            /tmp/godot-world.log
            /tmp/godot-v06.log
            /tmp/godot-v1.log
            /tmp/godot-v2.log
            /tmp/godot-v5.log
            /tmp/godot-v6.log
            /tmp/godot-v7.log
            /tmp/godot-aether-mechanics.log
            /tmp/godot-v8.log
          if-no-files-found: ignore
